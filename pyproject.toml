[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt2fig"
version = "1.0.0"
description = "Local PowerPoint figure exporter for macOS and Windows"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "pypdf>=5,<7"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
build = ["pyinstaller>=6,<7"]
test = ["reportlab>=4,<5"]

[project.scripts]
ppt2fig = "ppt2fig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
